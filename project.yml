name: AcmeBank
options:
  bundleIdPrefix: com.acmebank
  deploymentTarget:
    iOS: "17.0"
packages:
  OktaMobileSwift:
    url: https://github.com/okta/okta-mobile-swift
    from: 2.0.0
targets:
  AcmeBank:
    type: application
    platform: iOS
    sources: [AcmeBank]
    # xcconfig holding the OKTA_* build settings. `Secrets.example.xcconfig`
    # ships placeholder values and `#include?`s the gitignored
    # `Secrets.local.xcconfig` (generated by setup.sh) when present. Xcode's
    # `ProcessInfoPlistFile` expands the `$(OKTA_*)` refs in
    # `AcmeBank/Info.plist` on every build, so the built bundle is always
    # in sync with the xcconfig — no post-build mutation needed.
    configFiles:
      Debug: Config/Secrets.example.xcconfig
      Release: Config/Secrets.example.xcconfig
    dependencies:
      # Consumed by `RealDirectAuthFlow` in
      # `AcmeBank/Core/Auth/OktaAuthService.swift` — the production
      # adapter that drives the OIDC password-grant sign-in flow.
      - package: OktaMobileSwift
        product: OktaDirectAuth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acmebank.mobile
        SWIFT_VERSION: "5.10"
        INFOPLIST_FILE: AcmeBank/Info.plist
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        CODE_SIGN_ENTITLEMENTS: AcmeBank/AcmeBank.entitlements
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  AcmeBankTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AcmeBankTests]
    dependencies:
      - target: AcmeBank
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  AcmeBankUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AcmeBankUITests]
    dependencies:
      - target: AcmeBank
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
schemes:
  AcmeBank:
    build:
      targets: { AcmeBank: all }
    test:
      targets:
        - name: AcmeBankTests
        - name: AcmeBankUITests
      parallelizable: false
